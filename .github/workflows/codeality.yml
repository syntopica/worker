# Generated by codeality-dart init and codeality-swift init. Each job belongs
# to the tool that wrote it: re-running init adds missing jobs and reports
# edited ones as conflicts. Call it from a job in your own CI:
#   uses: ./.github/workflows/codeality.yml
name: codeality
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  go:
    name: codeality-go (.)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      # The duplicates stage runs jscpd through npx.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install the tools of the gate
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          go install github.com/syntopica/codeality/packages/codeality-go/cmd/codeality-go@v0.1.0
      - name: Run the gate
        run: codeality-go gate
