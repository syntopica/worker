name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      - name: Check the lockfile is current
        run: uv lock --check

      # Every extra and every group: the gate audits and tests the environment
      # it runs in, and a group-only install leaves out the extras the tests
      # import.
      - name: Install from the lockfile
        run: uv sync --locked --all-extras --all-groups
        env:
          UV_PYTHON: ${{ matrix.python-version }}

      - name: Run the quality gate
        run: uv run codeality-py gate --json

      - name: Type-check with pyrefly, without blocking
        continue-on-error: true
        run: |
          uv run --with pyrefly pyrefly check --output-format json > pyrefly.json || true

      - name: Upload the pyrefly shadow report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pyrefly-shadow-${{ matrix.python-version }}
          path: pyrefly.json
          retention-days: 90

  security:
    name: secrets + workflow lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: gitleaks cannot see a secret committed three commits ago
      # from a shallow clone. The CLI, not gitleaks-action: the action needs a
      # paid license on organization repositories.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --ignore-missing -c "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        run: gitleaks detect --no-banner --redact

      - name: Workflow lint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2

      - name: Workflow security
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
